{% extends "base.html" %} {% block content %}
<h1>Portfolio Dashboard</h1>

<div class="portfolio-container p-4 bg-white shadow rounded mt-4">
  <h2 class="text-xl font-semibold mb-2">Portfolio Summary</h2>

  <div id="current-value" class="mb-1">Current Value: Loading...</div>
  <div id="total-invested" class="mb-1">Total Invested: Loading...</div>
  <div id="total-profit" class="mb-1">Total Profit: Loading...</div>
  <div id="btc-price" class="mt-2 text-sm text-gray-600">
    BTC Price: Loading...
  </div>
  <div id="update-status" class="mt-4 text-xs text-gray-500">
    Status: Initializing...
  </div>

  <!-- Add empty script tags -->
  <script>
    // JavaScript will go here in the next steps
    console.log("Portfolio page script area loaded.");

    // Global variables
    let portfolioChart = null;
    let currentPeriod = "1m"; // Default to 1 month

    // Function to update the UI elements
    function updatePortfolioUI(data) {
      console.log("Attempting to update UI with data:", data); // Log input data
      // The formatCurrency function explained in detailed but simple terms:
      // 1. It takes a value as input
      // 2. It checks if the value is defined and not null
      // 3. If it is, it converts the value to a number and formats it to 2 decimal places
      // 4. If it is not, it returns "N/A"

      const formatCurrency = (value) =>
        value !== undefined && value !== null
          ? parseFloat(value).toFixed(2)
          : "N/A";

      // The purpose of this const function in detailed but simple terms step by step is:

      const currentValueElement = document.getElementById("current-value");
      if (currentValueElement) {
        currentValueElement.innerText = `Current Value: $${formatCurrency(
          data.current_value
        )}`;
        console.log("Updated current-value");
      } else {
        console.error("Element with ID 'current-value' not found!");
      }
      // This is the same as the currentValueElement but for the total invested value. This code can eventually be refactored to use the same function for both values.
      const totalInvestedElement = document.getElementById("total-invested");
      if (totalInvestedElement) {
        totalInvestedElement.innerText = `Total Invested: $${formatCurrency(
          data.total_invested
        )}`;
        console.log("Updated total-invested");
      } else {
        console.error("Element with ID 'total-invested' not found!");
      }

      const totalProfitElement = document.getElementById("total-profit");
      if (totalProfitElement) {
        totalProfitElement.innerText = `Total Profit: $${formatCurrency(
          data.total_profit
        )}`;
        console.log("Updated total-profit");
      } else {
        console.error("Element with ID 'total-profit' not found!");
      }

      const btcPriceElement = document.getElementById("btc-price");
      if (btcPriceElement) {
        btcPriceElement.innerText = `BTC Price: $${formatCurrency(
          data.btc_price
        )}`;
        console.log("Updated btc-price");
      } else {
        console.error("Element with ID 'btc-price' not found!");
      }

      // This is the same as the btcPriceElement but for the status element. This code can eventually be refactored to use the same function for both values.
      const statusElement = document.getElementById("update-status");
      if (statusElement) {
        const now = new Date();
        const timeString = now.toLocaleTimeString();
        statusElement.innerText = `Status: UI Updated at ${timeString} (Fetched Data)`;
        console.log("Updated update-status");
      } else {
        console.error("Element with ID 'update-status' not found!");
      }
    }

    // --- Add the Fetch Function ---
    // This function is used to fetch the portfolio data from the server which in simple terms
    // means that it is used to get the data from the server and update the UI with the fetched data.

    function fetchPortfolioData() {
      // What this is doing in simple terms is the following:
      // 1. It gets the status element from the DOM
      // 2. It updates the inner text of the status element to "Status: Fetching data..."
      // 3. It logs the message "Fetching portfolio data via HTTP from /api/portfolio/..."
      // 4. It fetches the portfolio data from the server using the fetch function
      // 5. It parses the JSON data and updates the UI with the fetched data

      const statusElement = document.getElementById("update-status");
      // if the status element is found, it updates the inner text of the status element to "Status: Fetching data..."
      if (statusElement) statusElement.innerText = "Status: Fetching data...";
      console.log("Fetching portfolio data via HTTP from /api/portfolio/...");

      fetch("/api/portfolio/") // The actual API call
        .then((response) => {
          console.log("Received response from server.");
          if (!response.ok) {
            // Handle HTTP errors (like 404 Not Found, 500 Server Error)
            console.error(
              `Network response error: ${response.status} ${response.statusText}`
            );
            // Try to read the response body for more details if possible
            return response.text().then((text) => {
              console.error("Error response body:", text);
              throw new Error(
                `API request failed (${response.status}): ${response.statusText}`
              );
            });
          }
          console.log("Response OK, parsing JSON...");
          return response.json(); // Parse JSON body if response is OK
        })
        .then((data) => {
          // This block runs only if the response was OK and JSON parsing succeeded
          console.log("Successfully parsed JSON data:", data);
          updatePortfolioUI(data); // Update the UI with the fetched data
        })
        .catch((error) => {
          // This block runs if fetch failed (network error) OR if response was not OK OR if JSON parsing failed
          console.error("Error during fetch or processing:", error);
          if (statusElement)
            statusElement.innerText = `Status: Error - ${error.message}`;
          // Optionally clear or indicate error in the main data fields
          // document.getElementById("current-value").innerText = `Current Value: Error fetching`;
        });
    }

    // Function to fetch historical portfolio data
    function fetchPortfolioHistory(period) {
      // Check if the loading element exists before trying to access it
      const loadingElement = document.getElementById("chart-loading");
      if (loadingElement) {
        loadingElement.classList.remove("hidden");
      }

      console.log(`Fetching portfolio history for period: ${period}`);
      fetch(`/api/portfolio/history/?period=${period}`)
        .then((response) => {
          console.log("Received history response from server.");
          if (!response.ok) {
            throw new Error(
              `API request failed (${response.status}): ${response.statusText}`
            );
          }
          return response.json();
        })
        .then((data) => {
          console.log("Successfully parsed history JSON:", data);
          updatePortfolioChart(data.labels, data.values);
          // Check if the loading element exists before trying to access it
          if (loadingElement) {
            loadingElement.classList.add("hidden");
          }
        })
        .catch((error) => {
          console.error("Error during history fetch:", error);
          // Check if the loading element exists before trying to access it
          if (loadingElement) {
            loadingElement.classList.add("hidden");
          }
          // You could add an error message to the chart container here
        });
    }

    // Function to update the chart with new data
    function updatePortfolioChart(labels, values) {
      // If chart already exists, destroy it first
      if (portfolioChart) {
        portfolioChart.destroy();
      }

      const ctx = document.getElementById("portfolioChart").getContext("2d");

      portfolioChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Portfolio Value ($)",
              data: values,
              backgroundColor: "rgba(75, 192, 192, 0.2)",
              borderColor: "rgba(75, 192, 192, 1)",
              borderWidth: 2,
              tension: 0.1,
              pointRadius: 2,
              pointHoverRadius: 5,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: "Portfolio Value Over Time",
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  return `$${context.parsed.y.toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                  })}`;
                },
              },
            },
            legend: {
              display: false,
            },
          },
          scales: {
            y: {
              beginAtZero: false,
              ticks: {
                callback: function (value) {
                  return "$" + value.toLocaleString();
                },
              },
            },
            x: {
              grid: {
                display: false,
              },
            },
          },
          interaction: {
            mode: "index",
            intersect: false,
          },
        },
      });
    }

    // Set up event listeners for period buttons
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".period-btn").forEach((button) => {
        button.addEventListener("click", function () {
          // Remove active class from all buttons
          document.querySelectorAll(".period-btn").forEach((btn) => {
            btn.classList.remove("active");
            btn.classList.remove("bg-blue-500");
            btn.classList.remove("text-white");
          });

          // Add active class to clicked button
          this.classList.add("active");
          this.classList.add("bg-blue-500");
          this.classList.add("text-white");

          // Get the period from the button's data attribute
          const period = this.getAttribute("data-period");
          currentPeriod = period;

          // Fetch data for this period
          fetchPortfolioHistory(period);
        });
      });

      // Style the default active button
      const defaultButton = document.querySelector(
        '.period-btn[data-period="1m"]'
      );
      if (defaultButton) {
        defaultButton.classList.add("bg-blue-500");
        defaultButton.classList.add("text-white");
      }

      // Initialize the chart with the default period (1m)
      fetchPortfolioHistory("1m");
    });

    // --- Initial Data Load ---
    console.log("Performing initial data fetch...");
    fetchPortfolioData();
    console.log("Initial fetch request initiated.");
  </script>

  <!-- Portfolio chart container with time period selectors -->
  <div class="portfolio-chart-container p-4 bg-white shadow rounded mt-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">Portfolio Performance</h2>

      <!-- Time period selector -->
      <div class="time-period-selector">
        <button class="period-btn px-3 py-1 mx-1 rounded" data-period="1d">
          1D
        </button>
        <button class="period-btn px-3 py-1 mx-1 rounded" data-period="1w">
          1W
        </button>
        <button
          class="period-btn px-3 py-1 mx-1 rounded active"
          data-period="1m"
        >
          1M
        </button>
        <button class="period-btn px-3 py-1 mx-1 rounded" data-period="1y">
          1Y
        </button>
        <button class="period-btn px-3 py-1 mx-1 rounded" data-period="5y">
          5Y
        </button>
      </div>
    </div>

    <!-- Canvas for the chart -->
    <canvas id="portfolioChart" width="400" height="200"></canvas>

    <!-- Loading indicator for the chart -->
    <div id="chart-loading" class="text-center py-4 hidden">
      Loading chart data...
    </div>
  </div>

  <!-- Add Chart.js library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Additional styles for the chart container */
    .portfolio-chart-container {
      height: 400px;
    }

    /* Style for period buttons */
    .period-btn {
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-btn:hover:not(.active) {
      background-color: #f0f0f0;
    }

    /* Hide class for loading indicator */
    .hidden {
      display: none;
    }
  </style>
  {% endblock %}
</div>
