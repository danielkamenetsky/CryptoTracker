version: "3.8"
services:
  # Zookeeper stores the metadata for the Kafka cluster
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  # Kafka broker is the main component that receives and processes messages
  kafka-broker:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  # PostgreSQL Database Service
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: tracker_database
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Django web application
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - kafka-broker
      - db
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092
      - DEBUG=1
      - DATABASE_URL=postgres://dbuser:password123@db:5432/tracker_database
      - DB_HOST=db
      - DB_NAME=tracker_database
      - DB_USER=dbuser
      - DB_PASSWORD=password123
      - DB_PORT=5432
    restart: unless-stopped

  # Redis for caching and real-time data
  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Price updater service
  price_updater:
    build: .
    command: python manage.py update_prices
    volumes:
      - .:/app
    depends_on:
      - redis
      - kafka-broker
      - db
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092
      - DEBUG=1
      - DATABASE_URL=postgres://dbuser:password123@db:5432/tracker_database
      - DB_HOST=db
      - DB_NAME=tracker_database
      - DB_USER=dbuser
      - DB_PASSWORD=password123
      - DB_PORT=5432
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
